<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}
/* BRAND: change these to the user's colours and font (from shorts-profile.md). */
:root{--brand:#1E40AF;--brand2:#3B6BF0;--accent:#93B4FF;--ink:#0b1220;--mid:#3a4453;--soft:#DBEAFE;--pill:#F1F5FB;
 --track:#EEF2F7;--track2:#CBD5E1;--muted:#64748b;--line:rgba(15,23,42,.07);--sh:0 22px 70px rgba(15,23,42,.28);
 --font:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif}
body{background:transparent;font-family:var(--font)}
.card{background:#fff;border-radius:24px;border:1px solid var(--line);box-shadow:var(--sh);position:absolute}
.eyebrow{display:inline-block;background:var(--soft);color:var(--brand);font-weight:800;font-size:17px;letter-spacing:.7px;border-radius:999px;padding:7px 16px;text-transform:uppercase}
.h{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-.5px;line-height:1.15}
.sub{font-size:21px;font-weight:600;color:var(--mid);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:10px;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:11px 20px;font-size:23px;font-weight:700;color:var(--ink);white-space:nowrap;opacity:0}
.pill .d{width:12px;height:12px;border-radius:50%;background:var(--brand)}
.num{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.hdr{display:flex;align-items:center;gap:18px}
.dash{stroke:var(--brand);stroke-width:6;fill:none;stroke-dasharray:16 12;stroke-linecap:round}
.ah{fill:var(--brand)}
.lbl{position:absolute;font-weight:800;opacity:0}
</style></head><body>
<div id="root" data-composition-id="feed" data-start="0" data-width="760" data-height="420" data-duration="10" style="width:760px;height:420px;position:relative">
 <div id="scene" class="clip" data-start="0" data-duration="10" data-track-index="0" style="position:absolute;inset:0">
  <div id="c" class="card" style="left:20px;top:20px;width:720px;height:380px;padding:32px 40px;opacity:0">
   <div class="eyebrow">Your inbox</div>
   <div class="h" style="margin-top:14px">Where the opens come from</div>
   <div style="position:absolute;left:40px;top:150px;width:640px;height:54px;border-radius:14px;background:var(--track);overflow:hidden">
     <div id="seg1" style="position:absolute;left:0;top:0;height:54px;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:14px"></div>
     <div id="seg2" style="position:absolute;left:213px;top:0;height:54px;width:0;background:var(--track2);border-radius:0 14px 14px 0"></div>
   </div>
   <div id="l1" class="lbl" style="left:40px;top:222px;color:var(--brand);font-size:26px">⅓ real readers</div>
   <div id="l2" class="lbl" style="left:330px;top:216px;color:var(--mid);font-size:21px;font-weight:700;width:350px;line-height:1.25">the rest: privacy proxies opening every email</div>
   <div id="in" style="position:absolute;left:40px;top:290px;width:52px;height:52px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;opacity:0">@</div>
   <svg id="arr" style="position:absolute;left:100px;top:276px;opacity:0" width="110" height="80" viewBox="0 0 110 80">
     <path class="dash" d="M6 40 H74"/><polygon class="ah" points="102,40 76,26 76,54"/>
   </svg>
   <div id="l3" class="lbl" style="left:222px;top:302px;color:var(--ink);font-size:23px;font-weight:800;width:460px">This part is not a person</div>
  </div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
const tl=gsap.timeline({paused:true});
tl.fromTo('#c',{opacity:0,y:30,scale:.96},{opacity:1,y:0,scale:1,duration:.45,ease:'power3.out'},0);
tl.to('#seg1',{width:213,duration:1.1,ease:'power2.out'},1.3);
tl.to('#l1',{opacity:1,duration:.35},2.3);
tl.to('#seg2',{width:427,duration:1.0,ease:'power2.out'},5.5);
tl.to('#l2',{opacity:1,duration:.35},6.2);
tl.fromTo('#in',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.4,ease:'back.out(2)'},6.7);
tl.to('#arr',{opacity:1,duration:.3},7.0);
tl.to('#arr .dash',{strokeDashoffset:-140,duration:3,ease:'none'},7.0);
tl.to('#l3',{opacity:1,duration:.35},7.3);
tl.to({},{duration:.1},9.9);
window.__timelines=window.__timelines||{};window.__timelines['feed']=tl;
</script></body></html>
